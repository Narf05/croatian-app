name: Deploy backend (Cloudflare Workers)

# Runs only after the CLOUDFLARE_API_TOKEN secret has been added to the repository.
on:
  push:
    branches: [main]
    paths: ["backend/**", "shared/**", "package-lock.json"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping backend deploy."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v5
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      - if: env.HAS_TOKEN == 'true'
        run: npm test -w shared && npm test -w backend
      - if: env.HAS_TOKEN == 'true'
        run: npx wrangler deploy
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

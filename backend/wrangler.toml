name = "croatian-app-backend"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# The GitHub Pages origin of the frontend (and the local dev server).
ALLOWED_ORIGINS = "https://narf05.github.io,http://localhost:5173"
DAILY_LIMIT = "300"

# Daily request counter. Create it once with:
#   npx wrangler kv namespace create USAGE
# and paste the returned id below.
# [[kv_namespaces]]
# binding = "USAGE"
# id = "<paste id here>"

# Secrets (never in this file). Set them once with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ACCESS_TOKEN
